version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: bookmark_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bookmark_net

  redis:
    image: redis:7.0-alpine
    container_name: bookmark_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bookmark_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmark_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/bookmark
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    networks:
      - bookmark_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmark_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bookmark_net

volumes:
  mongodb_data:
  redis_data:

networks:
  bookmark_net:
    driver: bridge
